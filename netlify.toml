# Before each publish Netlify runs two small steps; neither changes the GitHub repository.
#   tools/build_extra.py : share pages for blog posts, sitemap.xml, robots.txt, rss.xml, OpenAlex citation counts
#   tools/optimize.py    : shrinks oversized photos and makes thumbnails
# If either step fails, the site is still published.
[build]
  publish = "."
  command = "python3 tools/build_extra.py || echo 'extras skipped'; (python3 -m pip install --quiet Pillow || python3 -m pip install --quiet --break-system-packages Pillow) && python3 tools/optimize.py || echo 'optimize step skipped'"
