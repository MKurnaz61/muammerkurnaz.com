# Before each publish Netlify runs two small steps; neither changes the GitHub repository.
#   tools/build_extra.py : share pages for blog posts, sitemap.xml, robots.txt, rss.xml, OpenAlex citation counts
#   tools/optimize.py    : shrinks oversized photos and makes thumbnails
# If either step fails, the site is still published.
[build]
  publish = "."
  command = "python3 tools/build_extra.py || echo 'extras skipped'; (python3 -m pip install --quiet 'Pillow>=11.3,<13' || python3 -m pip install --quiet --break-system-packages 'Pillow>=11.3,<13') && python3 tools/optimize.py || echo 'optimize step skipped'"

# Security headers for every page. The public pages also carry their own Content-Security-Policy
# (a <meta> tag in each HTML file); the admin panel gets a separate, looser one below because
# Decap CMS needs GitHub and Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://api.netlify.com https://raw.githubusercontent.com https://*.githubusercontent.com https://cdn.jsdelivr.net; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
